# Simple Databricks Asset Bundle for the assignment pipeline.
bundle:
  name: databricks-medallion-pipeline
  databricks_cli_version: ">= 0.218.0"

# Authentication fields do not support bundle-variable interpolation. Supply
# the environment-specific host through DATABRICKS_HOST or an auth profile.

# Sync only runtime code and the seed CSVs required by Bronze. Documentation,
# tests, local environments, Cursor files, and AI prompt records stay local.
sync:
  paths:
    - ./src/bronze
    - ./src/silver
    - ./src/gold
    - ./data

resources:
  jobs:
    medallion_pipeline:
      name: databricks-medallion-pipeline-${bundle.target}
      description: Run the Bronze, Silver, and Gold assignment pipeline in order.

      # Free Edition is serverless-only. Python script tasks require an
      # environment key when no classic job cluster is configured.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        - task_key: bronze_ingestion
          spark_python_task:
            python_file: ./src/bronze/ingest_bronze.py
          environment_key: default

        - task_key: silver_quality
          depends_on:
            - task_key: bronze_ingestion
          spark_python_task:
            python_file: ./src/silver/create_silver_tables.py
          environment_key: default

        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_quality
          spark_python_task:
            python_file: ./src/gold/create_gold_tables.py
          environment_key: default

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
